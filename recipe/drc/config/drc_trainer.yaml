defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: drc_adversarial_rl
  experiment_name: drc_gen_vs_fix_grpo_v2
  total_epochs: 15
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: 5
  test_freq: 5
  logger: ["console"]

# 1. 数据配置
data:
  #_target_: verl.utils.dataset.drc_dataset.DRCDataset
  train_files: /inspire/hdd/global_user/wuyouran-253108540218/llm/verl/drc_data_square/train.parquet
  val_files: /inspire/hdd/global_user/wuyouran-253108540218/llm/verl/drc_data_square/val.parquet
  #prompt_key: generation_prompt
  max_prompt_length: 4096
  max_response_length: 4096
  train_batch_size: 4  # 全局 Batch Size (PPO update step size)
  filter_overlong_prompts: True
  truncation: error
  dataloader_num_workers: 0
  return_raw_chat: True
  # custom_cls:
  #   path: "/inspire/hdd/global_user/wuyouran-253108540218/llm/verl/verl/utils/dataset/drc_dataset.py"
  #   name: "DRCDataset"


# 2. 算法配置 (GRPO)
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

# 3. 核心配置：Actor, Rollout, Ref Model
actor_rollout_ref:
  model:
    path: /inspire/hdd/global_user/wuyouran-253108540218/llm/Qwen2.5-VL-3B-Instruct
    use_remove_padding: True
    enable_gradient_checkpointing: True
    # LoRA 配置
    # lora_rank: 64
    # lora_alpha: 32
    # target_modules: all-linear
    # exclude_modules: '.*visual.*' # 避免对视觉编码器进行 LoRA，节省显存

  # --- [FIXED] PPO Actor 配置 (补全了缺失的 batch size) ---
  actor:
    optim:
      lr: 3e-6
    # 关键参数：防止 Assertion Error
    ppo_mini_batch_size: 1            # 每次 PPO 更新的数据块大小
    ppo_micro_batch_size_per_gpu: 1     # 单卡计算梯度的 Batch Size (显存瓶颈看这里)
    use_kl_loss: True
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    
    # FSDP 策略 (显存优化)
    fsdp_config:
      param_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: [Qwen2VLDecoderLayer] # 根据模型结构自动推断，通常不需要手写

  # --- Rollout 配置 (vLLM / SGLang) ---
  rollout:
    name: vllm
    gpu_memory_utilization: 0.5  # 留一半显存给 Training Actor
    tensor_model_parallel_size: 1 # 7B模型通常需要TP=2或4
    mode: async
    # [关键] GRPO 需要多次采样来计算 Baseline
    n: 5  # 每个 Prompt 生成 5 条回复
    
    # 推理时的 Batch Size
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      agent_loop_config_path: /inspire/hdd/global_user/wuyouran-253108540218/llm/verl/recipe/drc/config/agent.yaml
      default_agent_loop: drc_agent
    
    # 启用 Multi-turn Tool Support
    multi_turn:
      enable: true
      max_assistant_turns: 5
      tool_config_path: verl/tools/config/drc_tools.yaml
      interaction_config_path: verl/interactions/config/drc_interaction.yaml
      # format: qwen-vl

  # --- Ref Model 配置 (通常 Offload 到 CPU 省显存) ---
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: True  # 将 Ref 模型参数卸载到 CPU

# 4. 奖励配置
reward_model:
  enable: false
  reward_manager: drc
  reward_manager_config:
    num_examine: 1