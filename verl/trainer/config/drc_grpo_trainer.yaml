# verl/trainer/config/drc_grpo_trainer.yaml
defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: drc_adversarial_rl
  experiment_name: drc_gen_vs_fix_grpo
  total_epochs: 100
  n_gpus_per_node: 1 # Example, adjust as needed

data:
  _target_: verl.utils.dataset.drc_dataset.DRCDataset
  train_files: /inspire/hdd/global_user/wuyouran-253108540218/llm/verl/drc_data_square/train.parquet
  val_files: /inspire/hdd/global_user/wuyouran-253108540218/llm/verl/drc_data_square/val.parquet
  prompt_key: generation_prompt # From the dataset file
  max_prompt_length: 512
  max_response_length: 1024
  train_batch_size: 32 # This will be the number of "episode pairs" per step

actor_rollout_ref:
  model:
    path: ./Qwen2.5-VL-3B-Instruct
    # ... 其他模型配置
  
  rollout:
    name: vllm # 或 sglang，推荐 vllm 对于 Qwen2.5-VL 支持较好
    gpu_memory_utilization: 0.6
    
    # [核心配置] 启用原生 Multi-turn Tool Support
    multi_turn:
      enable: true
      max_assistant_turns: 5
      
      # 告诉 verl 工具定义在哪里，它会自动生成 System Prompt
      tool_config_path: verl/tools/config/drc_tools.yaml
      
      # 告诉 verl 交互环境在哪里
      interaction_config_path: verl/interactions/config/drc_interaction.yaml
      
      # 这里的 format 决定了 verl 如何渲染 prompt
      # 对于 Qwen2.5，这会让 verl 使用 chat template 自动处理 tool tokens
      format: qwen-vl
    
algorithm:
  adv_estimator: grpo # Use GRPO as requested

reward_model:
  enable: false # We are using a custom reward manager, not a separate RM model
  reward_manager: drc # This key registers our DRCRewardManager